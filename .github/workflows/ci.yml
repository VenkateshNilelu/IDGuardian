name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        # Mirrors the Dockerfile exactly: no torch/sentence-transformers --
        # app.py's serving path encodes text via onnxruntime directly (see
        # its semantic-layer comment), so this also doubles as a check that
        # the test suite genuinely passes without torch installed at all.
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        env:
          # Optional: if set as a repo secret, the MongoDB history round-trip
          # test runs for real; if absent, that test skips itself cleanly
          # (db.DB_AVAILABLE is False) rather than failing CI.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pytest tests/ -v
